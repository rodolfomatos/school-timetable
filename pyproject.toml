[project]
name = "school-timetable"
version = "0.1.0"
description = "Gerador de horários escolares com busca local (Tabu Search / Simulated Annealing)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Equipe school-timetable", email = "dev@school-timetable.local" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.8",
]
solver = [
    "ortools>=9.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/timetable --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
